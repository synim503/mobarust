[package]
name = "mobarust"
version = "0.1.0"
edition = "2024"
description = "Кроссплатформенный SSH/терминальный клиент в духе MobaXterm, на Rust + egui"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
vt100 = "0.18.1"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
directories = "6.0.0"

# SSH (optional — отключается сборкой --no-default-features)
# crypto-бэкенд ring: стабильно собирается на Windows CI (без NASM/CMake).
russh = { version = "0.65.1", default-features = false, features = ["flate2", "ring", "rsa"], optional = true }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util", "net", "sync", "time"], optional = true }

[features]
default = ["ssh"]
ssh = ["dep:russh", "dep:tokio"]

[profile.release]
opt-level = 3
lto = "thin"
